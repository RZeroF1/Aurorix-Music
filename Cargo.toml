[workspace]
members = [
    "core/aurorix-model",
    "core/aurorix-app",
    "core/aurorix-storage",
    "core/aurorix-library",
    "core/aurorix-playback",
    "core/aurorix-audio",
    "core/aurorix-sync",
    "core/aurorix-extensions",
    "core/aurorix-ffi-c",
    "core/aurorix-ffi-uniffi",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
